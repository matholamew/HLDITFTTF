<!DOCTYPE HTML>
<html>
    <head>
        <title>HLDITFTTF? - TECHSMITH'S LAIR</title>
        <link rel="icon" href="/images/favicon.ico" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        
        <style>
            body {
                background-color: #000;
                background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
                color: #fff;
                font-family: "Comic Sans MS", cursive;
                margin: 0; padding: 0; overflow-x: hidden;
            }

            /* --- IDLE FADE TRAIL --- */
            .cursor-trail {
                position: fixed;
                top: 0; left: 0;
                width: 20px; 
                height: 20px;
                pointer-events: none;
                z-index: 10000;
                transition: transform 0.05s linear, opacity 0.5s ease;
                opacity: 0; /* Hidden by default until move */
            }

            /* --- WINAMP STYLING --- */
            #winamp-wrapper {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                pointer-events: none; z-index: 9999;
            }

            .draggable-window {
                position: absolute; user-select: none; pointer-events: auto;
                box-shadow: 5px 5px 15px rgba(0,0,0,0.8);
            }

            #winamp-container {
                width: 300px; background: #27273d; border: 3px outset #4a4a7d;
                padding: 8px; color: #00ff00; font-family: Arial, sans-serif;
                top: 50px; left: 50px;
            }

            #playlist-window {
                width: 300px; background: #000; border: 3px outset #4a4a7d;
                display: none; height: 200px; padding: 5px;
                top: 204px; left: 50px; /* Snapped to bottom of main player */
            }

            .winamp-title-bar, .playlist-header {
                background: #000080; color: white; font-size: 10px;
                padding: 2px 5px; font-weight: bold; border-bottom: 1px solid #4a4a7d;
                cursor: grab; display: flex; justify-content: space-between;
            }

            #playlist-items { height: 155px; overflow-y: scroll; scrollbar-width: thin; }

            .playlist-item {
                font-size: 11px; padding: 3px; cursor: pointer; color: #00ff00;
                border-bottom: 1px solid #222; white-space: nowrap; overflow: hidden;
            }

            .playlist-item:hover { background: #3c3c5c; }
            .playlist-item.active { background: #000080; color: #fff; }

            .winamp-display {
                background: #000; border: 2px inset #444; padding: 5px;
                height: 50px; position: relative; overflow: hidden;
            }

            .winamp-timer { font-size: 24px; font-family: 'Courier New'; color: #00ff00; }
            .winamp-marquee { font-size: 10px; color: #00ff00; position: absolute; bottom: 5px; width: 100%; }

            .winamp-btn {
                background: #3c3c5c; border: 2px outset #6b6b9e; color: white;
                font-size: 12px; padding: 6px 2px; flex: 1; cursor: pointer;
            }

            #shuffle-toggle-btn.active { color: #ffff00; border-color: #ffff00; }

            .control-row { display: flex; gap: 2px; margin-top: 5px; }
            .winamp-vol-slider { width: 100%; accent-color: #00ff00; }
            
            .main-table { width: 90%; max-width: 800px; margin: 50px auto; background: #c0c0c0; border: 10px ridge #eee; padding: 15px; color: #000; }
            .inner-content { border: 2px inset #fff; background: #fff; padding: 20px; text-align: center; }
        </style>
    </head>
    <body>

        <div id="trail-container"></div>

        <div id="winamp-wrapper">
            <div id="winamp-container" class="draggable-window">
                <div class="winamp-title-bar" id="player-handle">
                    <span>WINAMP 2.91</span>
                    <span>_ &#9633; X</span>
                </div>
                <div class="winamp-display">
                    <div class="winamp-timer" id="timer">00:00</div>
                    <marquee class="winamp-marquee" id="now-playing">Stop Looking Think...</marquee>
                </div>
                <input type="range" class="winamp-vol-slider" id="volume-control" min="0" max="1" step="0.01" value="0.4">
                <div class="control-row">
                    <button class="winamp-btn" onclick="loadPrevSong()">&#9198;</button>
                    <button class="winamp-btn" id="play-pause-btn" onclick="handlePlayPause()">&#9654;</button>
                    <button class="winamp-btn" onclick="stopMusic()">&#9632;</button>
                    <button class="winamp-btn" onclick="loadNextSong()">&#9197;</button>
                </div>
                <button class="winamp-btn" style="width:100%; margin-top:5px;" onclick="togglePlaylist()">LIST</button>
            </div>

            <div id="playlist-window" class="draggable-window">
                <div class="playlist-header" id="playlist-handle">
                    <span>PLAYLIST</span>
                    <button id="shuffle-toggle-btn" onclick="toggleShuffle()" style="font-size:9px;">SHUFFLE: OFF</button>
                </div>
                <div id="playlist-items"></div>
            </div>
            <audio id="bg-audio"></audio>
        </div>

        <div class="main-table">
            <div class="inner-content">
                <h1 style="background: blue; color: white;">TECHSMITH'S LAIR</h1>
                <img src="https://media.howlongdoesittakefortechtofinish.com/images/torpesharpebysnaj.png" width="80" alt="TorpeSharpe">
                <p>Move your mouse to summon the TorpeSharpe trail. Stop moving to let them rest.</p>
            </div>
        </div>

        <script>
            // --- CURSOR TRAIL LOGIC WITH FADE ---
            const trailCount = 6;
            const trailImage = "https://media.howlongdoesittakefortechtofinish.com/images/torpesharpebysnaj.png";
            const dots = [];
            const mouse = { x: 0, y: 0 };
            let idleTimer;

            for (let i = 0; i < trailCount; i++) {
                const img = document.createElement('img');
                img.src = trailImage;
                img.className = 'cursor-trail';
                document.getElementById('trail-container').appendChild(img);
                dots.push({ x: 0, y: 0, element: img });
            }

            window.addEventListener('mousemove', e => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                
                // Show trail
                dots.forEach((dot, i) => {
                    dot.element.style.opacity = (0.7 - (i * 0.1));
                });

                // Clear existing timer and set new one to hide trail
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    dots.forEach(dot => dot.element.style.opacity = 0);
                }, 1000);
            });

            function updateTrail() {
                let x = mouse.x;
                let y = mouse.y;
                dots.forEach((dot, index) => {
                    dot.x += (x - dot.x) * 0.35;
                    dot.y += (y - dot.y) * 0.35;
                    dot.element.style.transform = `translate(${dot.x + 10}px, ${dot.y + 10}px)`;
                    x = dot.x; y = dot.y;
                });
                requestAnimationFrame(updateTrail);
            }
            updateTrail();

            // --- MUSIC & SNAP LOGIC ---
            const audio = document.getElementById('bg-audio');
            const playlistItemsContainer = document.getElementById('playlist-items');
            const originalPlaylist = [
                { name: "AMERICA - nedini_", url: "https://media.howlongdoesittakefortechtofinish.com/songs/AMERICA%20-%20Nedini.mp3" },
                { name: "LockedNLoaded - Metalus69", url: "https://media.howlongdoesittakefortechtofinish.com/songs/LockedNLoaded%20-%20Metalus.mp3" },
                { name: "The Struggle - shay_the_skunk", url: "https://media.howlongdoesittakefortechtofinish.com/songs/The%20Struggle%20(Stop%20Look%20Think)%20-%20Shay%20the%20Skunk.mp3" },
                { name: "Man Clam - Techsmith314", url: "https://media.howlongdoesittakefortechtofinish.com/songs/Techsmith314_-_Man_Clam.mp3" }
            ];

            let currentPlaylist = [...originalPlaylist];
            let currentIndex = 0;
            let isShuffle = false;
            let isSnapped = true;

            function renderPlaylistUI() {
                playlistItemsContainer.innerHTML = '';
                currentPlaylist.forEach((track, i) => {
                    const div = document.createElement('div');
                    div.className = 'playlist-item' + (i === currentIndex ? ' active' : '');
                    div.innerText = `${i + 1}. ${track.name}`;
                    div.onclick = () => playTrack(i);
                    playlistItemsContainer.appendChild(div);
                });
            }

            function playTrack(index) {
                currentIndex = index;
                audio.src = currentPlaylist[index].url;
                document.getElementById('now-playing').innerText = (isShuffle ? "🔀 " : "") + currentPlaylist[index].name;
                renderPlaylistUI();
                audio.play();
                document.getElementById('play-pause-btn').innerHTML = "&#10074;&#10074;";
            }

            function toggleShuffle() {
                isShuffle = !isShuffle;
                const btn = document.getElementById('shuffle-toggle-btn');
                const currentTrack = currentPlaylist[currentIndex];
                if (isShuffle) {
                    btn.innerText = "SHUFFLE: ON";
                    btn.classList.add('active');
                    currentPlaylist = [...currentPlaylist].sort(() => Math.random() - 0.5);
                } else {
                    btn.innerText = "SHUFFLE: OFF";
                    btn.classList.remove('active');
                    currentPlaylist = [...originalPlaylist];
                }
                currentIndex = currentPlaylist.indexOf(currentTrack);
                renderPlaylistUI();
            }

            const main = document.getElementById('winamp-container');
            const list = document.getElementById('playlist-window');
            
            function initDraggable(el, handle) {
                let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
                handle.onmousedown = (e) => {
                    p3 = e.clientX; p4 = e.clientY;
                    document.onmousemove = (e) => {
                        p1 = p3 - e.clientX; p2 = p4 - e.clientY;
                        p3 = e.clientX; p4 = e.clientY;
                        let nTop = el.offsetTop - p2;
                        let nLeft = el.offsetLeft - p1;
                        el.style.top = nTop + "px";
                        el.style.left = nLeft + "px";
                        if (el === main && isSnapped) {
                            list.style.top = (nTop + main.offsetHeight) + "px";
                            list.style.left = nLeft + "px";
                        }
                        if (el === list) {
                            const dY = Math.abs(nTop - (main.offsetTop + main.offsetHeight));
                            const dX = Math.abs(nLeft - main.offsetLeft);
                            if (dY < 25 && dX < 25) {
                                el.style.top = (main.offsetTop + main.offsetHeight) + "px";
                                el.style.left = main.offsetLeft + "px";
                                isSnapped = true;
                            } else { isSnapped = false; }
                        }
                    };
                    document.onmouseup = () => { document.onmousemove = null; };
                };
            }

            initDraggable(main, document.getElementById('player-handle'));
            initDraggable(list, document.getElementById('playlist-handle'));

            function handlePlayPause() {
                if (audio.paused) { audio.play(); document.getElementById('play-pause-btn').innerHTML = "&#10074;&#10074;"; }
                else { audio.pause(); document.getElementById('play-pause-btn').innerHTML = "&#9654;"; }
            }
            function stopMusic() { audio.pause(); audio.currentTime = 0; document.getElementById('play-pause-btn').innerHTML = "&#9654;"; }
            function loadNextSong() { playTrack((currentIndex + 1) % currentPlaylist.length); }
            function loadPrevSong() { playTrack((currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length); }
            function togglePlaylist() { list.style.display = (list.style.display === 'none') ? 'block' : 'none'; }
            
            document.getElementById('volume-control').oninput = (e) => audio.volume = e.target.value;
            audio.ontimeupdate = () => {
                let m = Math.floor(audio.currentTime / 60), s = Math.floor(audio.currentTime % 60);
                document.getElementById('timer').innerText = `${m}:${s<10?'0':''}${s}`;
            };
            audio.onended = loadNextSong;
            renderPlaylistUI();
        </script>
    </body>
</html>
